<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

<body>

    <header>
        <div class="logo">MUNDO<span>VELOZ</span></div>
        <nav>
            <a href="index.html">Início</a>

    <section id="contato" class="container bg-dark">
        <h2>Entre para o Clube</h2>
        <p>Receba novidades sobre o mundo dos supercarros.</p>
        <form id="form-contato" onsubmit="enviarDados(event)">
            <input type="text" id="nome" placeholder="Seu Nome" required>
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <textarea id="carro_favorito" placeholder="Qual seu carro favorito?" required></textarea>
            <button type="submit">Enviar Inscrição</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 - Desenvolvido pela Equipe de Devs Alunos. Projeto Carros Velozes.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://mnbpgcqctdpocraukrky.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uYnBnY3FjdGRwb2NyYXVrcmt5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NTQxNDQ2MSwiZXhwIjoyMTAwOTkwNDYxfQ.n_NSiwnseSFW0XEviChUZS3G_hl0zsglvGw9_eJxjqw'; 

        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function enviarDados(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const carroFavorito = document.getElementById('carro_favorito').value;

            // Envia para o Supabase (Ajuste o nome das colunas conforme seu banco de dados)
            const { data, error } = await _supabase
                .from('Contato')
                .insert([{ 
                    nome: nome, 
                    email: email, 
                    carro_favorito: carroFavorito 
                }]);

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('Dados salvos com sucesso!');
                document.getElementById('form-contato').reset();
            }
        }
    </script>
    <script src="script.js"></script>
</body>
